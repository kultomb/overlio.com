<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replay Overlay</title>
    <link rel="stylesheet" href="/overlays.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/tenant-utils.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
        }
        .replay-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 1000;
        }
        .replay-container {
            background: rgba(0, 0, 0, 0.95);
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .replay-video {
            width: 100%;
            height: 100%;
            border-radius: 0;
            box-shadow: none;
            background: #000;
            flex: 1;
            object-fit: cover;
        }
        
        @media (max-width: 768px) {
            .replay-container {
                width: 100vw;
                height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div class="replay-overlay" id="replay-overlay">
        <div class="replay-container">
            <div id="youtube-player" class="replay-video"></div>
        </div>
    </div>
    <script>
        // Get tenant ID from URL for multi-tenant support
        const pathParts = window.location.pathname.split('/').filter(part => part);
        const tenantId = pathParts[0];
        
        // Connect to Socket.IO server (always use default namespace)
        const socket = connectSocket();
        
        // Join the tenant room if we have a tenant ID
        if (tenantId && tenantId !== 'replay') {
            socket.emit('join', { tenantId: tenantId });
            console.log(`Joined tenant room: /${tenantId}`);
        }
        let player;
        let currentReplayData = {
            videoUrl: '',
            replayTime: '5s',
            matchTime: '00:00'
        };
        let currentVideoId = '';
        let lastReplayTime = 0;

        // YouTube Player API
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: '',
                playerVars: {
                    'autoplay': 0,
                    'mute': 1,
                    'controls': 0,
                    'showinfo': 0,
                    'rel': 0,
                    'modestbranding': 1,
                    'fs': 0,
                    'iv_load_policy': 3,
                    'cc_load_policy': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            console.log('YouTube player ready');
        }

        function onPlayerStateChange(event) {
            // Player state changed
        }

        function extractVideoId(url) {
            if (url.includes('youtube.com/embed/')) {
                return url.split('/embed/')[1].split('?')[0];
            }
            return null;
        }

        function showReplay(data = null) {
            if (data) {
                currentReplayData = { ...currentReplayData, ...data };
                updateReplayDisplay();
            }
            document.getElementById('replay-overlay').style.display = 'flex';
        }

        function hideReplay() {
            document.getElementById('replay-overlay').style.display = 'none';
            if (player && player.pauseVideo) {
                player.pauseVideo();
            }
        }

        function updateReplayDisplay() {
            if (!currentReplayData.videoUrl) return;
            
            const videoId = extractVideoId(currentReplayData.videoUrl);
            if (!videoId) return;

            const replayTime = currentReplayData.replayTime || '5s';
            const seconds = parseInt(replayTime.replace('s', ''));

            if (player && player.loadVideoById) {
                // If same video, just seek back
                if (currentVideoId === videoId && player.getCurrentTime) {
                    const currentTime = player.getCurrentTime();
                    const seekTime = Math.max(0, currentTime - seconds);
                    console.log(`Same video - Current: ${currentTime}s, Replay: ${seconds}s, Seek to: ${seekTime}s`);
                    player.seekTo(seekTime, true);
                    return;
                }

                // New video or first load
                currentVideoId = videoId;
                player.loadVideoById(videoId);
                
                // Wait for video to load then seek to appropriate time
                setTimeout(() => {
                    if (player && player.getDuration) {
                        const duration = player.getDuration();
                        // For new video, start from a reasonable position
                        const seekTime = Math.max(0, duration - 60 - seconds); // Start from 1 minute before end
                        console.log(`New video - Duration: ${duration}s, Replay: ${seconds}s, Seek to: ${seekTime}s`);
                        player.seekTo(seekTime, true);
                        player.playVideo();
                    }
                }, 2000);
            }
        }

        // Socket.IO event listeners
        socket.on('connect', () => console.log('Connected to replay overlay server'));
        socket.on('disconnect', () => console.log('Disconnected from replay overlay server'));
        socket.on('showReplay', (data) => {
            showReplay(data);
        });
        socket.on('hideReplay', () => {
            hideReplay();
        });

        // Instant Replay event listeners
        socket.on('showInstantReplay', (data) => {
            console.log('Instant replay received:', data);
            showInstantReplay(data);
        });
        
        socket.on('hideInstantReplay', () => {
            console.log('Hiding instant replay');
            hideInstantReplay();
        });

        // Instant Replay functions
        function showInstantReplay(data) {
            if (!data.videoUrl) return;
            
            const videoId = extractVideoId(data.videoUrl);
            if (!videoId) return;

            if (player && player.loadVideoById) {
                currentVideoId = videoId;
                player.loadVideoById(videoId);
                
                // For instant replay, we want to show the buffer immediately
                setTimeout(() => {
                    if (player && player.getDuration) {
                        const duration = player.getDuration();
                        // Start from the beginning of the buffer (duration - bufferDuration)
                        const bufferStart = Math.max(0, duration - data.bufferDuration);
                        console.log(`Instant replay - Duration: ${duration}s, Buffer: ${data.bufferDuration}s, Start: ${bufferStart}s`);
                        player.seekTo(bufferStart, true);
                        player.playVideo();
                    }
                }, 1000);
            }
            
            // Show the overlay
            document.getElementById('replay-overlay').style.display = 'flex';
        }

        function hideInstantReplay() {
            document.getElementById('replay-overlay').style.display = 'none';
            if (player && player.pauseVideo) {
                player.pauseVideo();
            }
        }

        // Initialize
        hideReplay();
    </script>
</body>
</html>
