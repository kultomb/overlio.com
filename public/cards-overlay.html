<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Overlay</title>
    <link rel="stylesheet" href="/overlays.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/tenant-utils.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }
        .cards-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            pointer-events: none;
            z-index: 1000;
        }
        .card-bar {
            margin-top: 60px;
            display: flex;
            align-items: stretch;
            background: linear-gradient(90deg, #0a1e5e 80%, #0a1e5e 100%);
            border-radius: 8px 8px 0 0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            min-width: 600px;
            min-height: 90px;
            max-width: 900px;
            width: 60vw;
            position: relative;
        }
        .team-logo {
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 8px 0 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px 0 5px 5px;
            overflow: hidden;
        }
        .team-logo img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }
        .card-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 0 20px;
        }
        .player-info {
            font-size: 2.2em;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 0.2em;
            text-shadow: 1px 1px 6px #000a;
        }
        .card-square {
            width: 40px;
            height: 40px;
            margin: auto 30px auto 0;
            border-radius: 4px;
            box-shadow: 0 2px 8px #0005;
        }
        .card-square.yellow {
            background: #ffe600;
            border: 2px solid #fff200;
        }
        .card-square.red {
            background: #ff2d2d;
            border: 2px solid #ff2d2d;
        }
        .card-type-label {
            width: 100%;
            background: #0a1e5e;
            color: #fff;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 10px 0 8px 0;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 16px #0005;
            margin-top: -2px;
            text-shadow: 1px 1px 6px #000a;
            transition: background-color 0.5s ease-in-out;
        }
        @media (max-width: 700px) {
            .card-bar {
                min-width: 320px;
                width: 98vw;
                padding: 0;
                min-height: 70px;
            }
            .team-logo {
                width: 50px;
                height: 50px;
            }
            .card-main {
                padding: 0 8px;
            }
            .player-info {
                font-size: 1.2em;
            }
            .card-square {
                width: 28px;
                height: 28px;
                margin-right: 10px;
            }
            .card-type-label {
                font-size: 1em;
                padding: 7px 0 6px 0;
            }
        }
        
        @media (max-width: 480px) {
            .card-bar {
                min-width: 280px;
                width: 95vw;
                min-height: 60px;
                margin-top: 40px;
            }
            .team-logo {
                width: 40px;
                height: 40px;
            }
            .team-logo img {
                width: 35px;
                height: 35px;
            }
            .card-main {
                padding: 0 6px;
            }
            .player-info {
                font-size: 1em;
                letter-spacing: 1px;
            }
            .card-square {
                width: 24px;
                height: 24px;
                margin-right: 8px;
            }
            .card-type-label {
                font-size: 0.9em;
                padding: 5px 0 4px 0;
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>
    <div class="cards-overlay" id="cards-overlay">
        <div>
            <div class="card-bar">
                <div class="card-main">
                    <div class="player-info" id="player-info">6 PLAYER #6</div>
                </div>
                <div class="card-square yellow" id="card-square"></div>
            </div>
            <div class="card-type-label" id="card-type-label">YELLOW CARD</div>
        </div>
    </div>
    <script>
        // Get tenant ID from URL for multi-tenant support
        const pathParts = window.location.pathname.split('/').filter(part => part);
        const tenantId = pathParts[0];
        
        // Connect to Socket.IO server (always use default namespace)
        const socket = connectSocket();
        
        // Join the tenant room if we have a tenant ID
        if (tenantId && tenantId !== 'cards') {
            socket.emit('join', { tenantId: tenantId });
            console.log(`Joined tenant room: /${tenantId}`);
        }
        let currentCardData = {
            type: 'yellow',
            player: 'PLAYER',
            team: 'HOME',
            time: '',
            playerNumber: '6',
        };

        function showCard(data = null) {
            if (data) {
                currentCardData = { ...currentCardData, ...data };
                updateCardDisplay();
            }
            document.getElementById('cards-overlay').style.display = 'flex';
        }

        function hideCard() {
            document.getElementById('cards-overlay').style.display = 'none';
        }

        function updateCardDisplay() {
            const playerInfo = document.getElementById('player-info');
            const teamName = currentCardData.team || 'HOME';
            const playerName = currentCardData.player || 'PLAYER';
            
            // Set text content with player name
            playerInfo.textContent = `${playerName.toUpperCase()} ${currentCardData.playerNumber}`;
            
            // Always use white color for player name
            playerInfo.style.color = '#fff';
            
            const cardSquare = document.getElementById('card-square');
            
            // Always use card type colors (yellow/red) regardless of team color
            cardSquare.className = 'card-square ' + (currentCardData.type === 'red' ? 'red' : 'yellow');
            
            // Update card type label with color transition
            const cardTypeLabel = document.getElementById('card-type-label');
            if (currentCardData.type === 'red') {
                cardTypeLabel.textContent = 'RED CARD';
                cardTypeLabel.style.background = '#ff2d2d';
                cardTypeLabel.style.color = '#fff';
            } else {
                cardTypeLabel.textContent = 'YELLOW CARD';
                cardTypeLabel.style.background = '#ffe600';
                cardTypeLabel.style.color = '#000';
            }
        }

        // Socket.IO event listeners
        socket.on('connect', () => console.log('Connected to cards overlay server'));
        socket.on('disconnect', () => console.log('Disconnected from cards overlay server'));
        socket.on('roomJoined', (data) => console.log('Room joined successfully:', data));
        socket.on('showCard', (data) => {
            showCard(data);
            if (window.autoHideTimer) clearTimeout(window.autoHideTimer);
            window.autoHideTimer = setTimeout(() => {
                hideCard();
            }, 4000);
        });
        socket.on('hideCard', () => {
            hideCard();
        });
        // Keyboard shortcut: Escape to hide
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') hideCard();
        });
        // Initialize with default data
        updateCardDisplay();
        hideCard();
    </script>
</body>
</html>
