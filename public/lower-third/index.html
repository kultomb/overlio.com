<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lower Third — OBS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/lower-third/style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/tenant-utils.js"></script>
</head>
<body>
    <div class="stage" id="stage">
        <div
            class="lower-third"
            id="lowerThird"
            role="region"
            aria-label="Now playing"
            aria-hidden="true"
            data-visible="false"
        >
            <div class="lower-third__accent" aria-hidden="true"></div>
            <div class="lower-third__visual" aria-hidden="true">
                <div class="lower-third__disc"></div>
                <div class="lower-third__wave">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
            <div class="lower-third__inner">
                <div class="lower-third__title" id="songTitle">—</div>
                <div class="lower-third__singer" id="singerName">—</div>
                <div class="lower-third__progress" aria-hidden="true"></div>
            </div>
        </div>
    </div>
    <script>
        (function () {
            const pathParts = window.location.pathname.split('/').filter(function (part) { return part; });
            const tenantId = pathParts[0];

            const socket = connectSocket();

            if (tenantId && tenantId !== 'lower-third') {
                socket.emit('join', { tenantId: tenantId });
            }

            const lowerThird = document.getElementById('lowerThird');
            const songTitleEl = document.getElementById('songTitle');
            const singerNameEl = document.getElementById('singerName');
            const params = new URLSearchParams(window.location.search);

            function getLtScale() {
                var raw = parseFloat(getComputedStyle(lowerThird).getPropertyValue('--lt-scale').trim());
                if (!Number.isFinite(raw)) raw = 1;
                return Math.max(0.45, Math.min(raw, 1.5));
            }

            function updateLtScale() {
                var requestedScale = parseFloat(params.get('scale') || '');
                var autoScale = Math.min(
                    1,
                    window.innerWidth / 560,
                    window.innerHeight / 140
                );
                var finalScale = Number.isFinite(requestedScale) && requestedScale > 0
                    ? requestedScale
                    : autoScale;
                lowerThird.style.setProperty('--lt-scale', String(Math.max(0.45, Math.min(finalScale, 1.5))));
            }

            function fitSingleLine(el, baseMaxPx, baseMinPx) {
                if (!el) return;
                var w = el.clientWidth;
                if (w <= 0) return;
                var scale = getLtScale();
                var maxPx = Math.max(baseMinPx * scale, baseMaxPx * scale);
                var minPx = Math.max(7, baseMinPx * scale);
                var size = maxPx;
                el.style.fontSize = size + 'px';
                while (size > minPx && el.scrollWidth > w + 0.5) {
                    size -= 0.5;
                    el.style.fontSize = size + 'px';
                }
                if (el.scrollWidth > w + 0.5) {
                    el.style.textOverflow = 'ellipsis';
                } else {
                    el.style.textOverflow = 'clip';
                }
            }

            var refitScheduled = false;
            function scheduleRefitText() {
                if (refitScheduled) return;
                refitScheduled = true;
                requestAnimationFrame(function () {
                    refitScheduled = false;
                    fitSingleLine(songTitleEl, 24, 11);
                    fitSingleLine(singerNameEl, 15, 9);
                });
            }

            function onResize() {
                updateLtScale();
                scheduleRefitText();
            }

            updateLtScale();
            var resizeTimer = null;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(onResize, 80);
            });

            if (typeof ResizeObserver !== 'undefined') {
                var ro = new ResizeObserver(function () {
                    scheduleRefitText();
                });
                ro.observe(lowerThird);
            }

            var autoHideTimer = null;
            var AUTO_HIDE_MS = 6000;

            function clearLowerThirdAutoHide() {
                if (autoHideTimer) {
                    clearTimeout(autoHideTimer);
                    autoHideTimer = null;
                }
            }

            function scheduleLowerThirdAutoHide() {
                clearLowerThirdAutoHide();
                autoHideTimer = setTimeout(function () {
                    autoHideTimer = null;
                    setBarVisible(false);
                    socket.emit('hideLowerThird');
                }, AUTO_HIDE_MS);
            }

            function setBarVisible(visible) {
                var vis = !!visible;
                lowerThird.setAttribute('data-visible', vis ? 'true' : 'false');
                lowerThird.setAttribute('aria-hidden', vis ? 'false' : 'true');
                if (vis) {
                    scheduleLowerThirdAutoHide();
                } else {
                    clearLowerThirdAutoHide();
                }
            }

            function applyLowerThirdData(data) {
                if (!data) return;
                if (data.title !== undefined && data.title !== null) {
                    songTitleEl.textContent = String(data.title).trim() || '—';
                }
                if (data.singer !== undefined && data.singer !== null) {
                    singerNameEl.textContent = String(data.singer).trim() || '—';
                }
                if (data.visible !== undefined) {
                    setBarVisible(data.visible);
                }
                scheduleRefitText();
            }

            socket.on('connect', function () {
                console.log('Lower third overlay connected');
            });

            socket.on('disconnect', function () {
                console.log('Lower third overlay disconnected');
            });

            socket.on('connect_error', function (err) {
                console.error('Lower third socket error:', err);
            });

            /* Giống scoreboard: showScoreboard / hideScoreboard */
            socket.on('showLowerThird', function () {
                setBarVisible(true);
            });

            socket.on('hideLowerThird', function () {
                setBarVisible(false);
            });

            /* Giống sponsor: sponsorUpdate — đồng bộ text + trạng thái */
            socket.on('lowerThirdUpdate', applyLowerThirdData);

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    setBarVisible(false);
                    socket.emit('hideLowerThird');
                }
            });

            setBarVisible(false);
            scheduleRefitText();
        })();
    </script>
</body>
</html>
